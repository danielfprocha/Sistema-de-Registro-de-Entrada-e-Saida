<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — Registro de Ponto</title>
  <link rel="stylesheet" href="../css/global.css" />
  <link rel="stylesheet" href="../css/login.css" />
</head>
<body>
  <header>
        <p class="header-titulo">Registro de <span id="header-entrada">Entrada</span> e <span id="header-saida">Saída</span></p>
  </header>

  <main class="login-container">
    <div class="main-box">

      <div class="login-header">
        <h1 class="box-titulo" data-local>Hospital Público</h1>
        <p class="box-subtitulo">Sistema de Registro de Ponto</p>
      </div>

      <div class="login-form">
        <div class="form-group">
          <label for="ra">RA</label>
          <input type="text" id="ra" inputmode="numeric" autocomplete="username" placeholder="Digite seu RA..." />
        </div>

        <div class="form-group">
          <label for="senha">Senha</label>
          <input type="password" id="senha" placeholder="Digite sua senha..." />
        </div>

        <p id="msg-erro" class="msg-erro"></p>

        <button id="btn-entrar" onclick="handleLogin()">Fazer Login</button>
      </div>

    </div>
  </main>

  <footer>
        <p>Sistema de Registro de Ponto - Clínica Veterinária UniBH</p>
  </footer>

  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script>
    if (getUsuarioLogado()) {
      window.location.href = "qrcode.html";
    }

    document.getElementById("senha").addEventListener("keydown", e => {
      if (e.key === "Enter") handleLogin();
    });

        async function handleLogin() {
      const ra = document.getElementById("ra").value.trim();
      const senha = document.getElementById("senha").value.trim();
      const msgErro = document.getElementById("msg-erro");
      const btn = document.getElementById("btn-entrar");

      msgErro.textContent = "";

      if (!ra || !senha) {
        msgErro.textContent = "Preencha o RA e a senha.";
        return;
      }

      btn.disabled = true;
      btn.textContent = "Carregando...";

      try {
        const resultado = await login(ra, senha);
        if (resultado.sucesso) {
          window.location.href = "qrcode.html";
          return;
        }
        msgErro.textContent = resultado.mensagem;
        document.getElementById("senha").value = "";
      } catch (erro) {
        console.error(erro);
        msgErro.textContent = "Erro inesperado. Veja o console do navegador.";
      } finally {
        btn.disabled = false;
        btn.textContent = "Fazer Login";
      }
    }
  </script>

</body>
</html>
